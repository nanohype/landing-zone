# Manual end-to-end: provision a real EKS substrate, install the operator,
# deploy one tenant via GitOps, assert real-IRSA + cloudgov, tear it all down.
#
# workflow_dispatch ONLY — never scheduled — because each run provisions real,
# billable AWS. scripts/e2e.sh always tears down (EXIT trap), so a failed run
# does not leave billing on.
#
# Requires:
#   vars.E2E_AWS_ROLE_ARN   — an OIDC role in the target account with rights to
#                             provision/destroy the substrate + IAM (the operator
#                             installs via GitOps from ghcr, so no ECR needed).
#   secrets.E2E_GITHUB_TOKEN — a token (PAT or App) with read on
#                             eks-agent-platform + cloudgov and write on the
#                             tenants repo (deploy-key admin + push).
name: e2e (manual)

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: "Target AWS account ID (12 digits)"
        required: true
      region:
        description: "Region"
        default: "us-east-1"
      environment:
        description: "Env tree (development | staging | production)"
        default: "development"
      account_dir:
        description: "Account directory (workload-development | workload-production)"
        default: "workload-development"
      tenant:
        description: "Tenant name to create"
        default: "e2e-smoke"

permissions:
  id-token: write
  contents: read

# Never let two runs race on the same region's substrate.
concurrency:
  group: e2e-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Two jobs at once. It scopes the OIDC subject claim to
    # `repo:nanohype/landing-zone:environment:e2e`, which is what the deploy role
    # trusts — without it the token presents `ref:refs/heads/main`, matches no
    # claim, and the role cannot be assumed at all. And it is the place to hang
    # required reviewers, which is worth having on the one workflow in this repo
    # that provisions billable AWS on a button press.
    environment: e2e
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/eks-agent-platform
          path: .siblings/eks-agent-platform
          token: ${{ secrets.E2E_GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/cloudgov
          path: .siblings/cloudgov
          token: ${{ secrets.E2E_GITHUB_TOKEN }}
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: "1.11.5"
      # The same version ci.yml validates every leaf against. It was 0.99.4 here
      # while ci.yml pinned 1.0.8 — and the `run-all` to `run --all` CLI change
      # straddles that boundary, so this workflow, the only one that spends real
      # money, was applying config that had been validated by a different tool.
      - name: install terragrunt
        run: |
          set -euo pipefail
          # Bounded and verified. An unverified binary fetched over the network is
          # the widest hole in this workflow: it runs next, holding an OIDC
          # credential for a real AWS account. The published SHA256SUMS is fetched
          # from the same release and checked before the binary is made executable.
          curl -fsSL --max-time 120 -o /tmp/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          curl -fsSL --max-time 60 -o /tmp/terragrunt.SHA256SUMS \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/SHA256SUMS"
          grep ' terragrunt_linux_amd64$' /tmp/terragrunt.SHA256SUMS \
            | sed 's| terragrunt_linux_amd64$|  /tmp/terragrunt|' \
            | sha256sum -c -
          install -m 0755 /tmp/terragrunt /usr/local/bin/terragrunt
          terragrunt --version
        env:
          TERRAGRUNT_VERSION: "1.0.8"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.E2E_AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      # Let the tenants-repo clone/push (and the bootstrap deploy key) use the
      # token over https, transparently rewriting the SSH URL.
      - name: configure git auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.E2E_GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: run e2e (provision → tenant → validate → teardown)
        env:
          E2E_ACCOUNT_ID: ${{ inputs.account_id }}
          E2E_REGION: ${{ inputs.region }}
          E2E_ENV: ${{ inputs.environment }}
          E2E_ACCOUNT_DIR: ${{ inputs.account_dir }}
          E2E_TENANT: ${{ inputs.tenant }}
          E2E_EKS_AGENT_PLATFORM_DIR: ${{ github.workspace }}/.siblings/eks-agent-platform
          E2E_CLOUDGOV_DIR: ${{ github.workspace }}/.siblings/cloudgov
          GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          AWS_PROFILE: "" # use the OIDC env credentials, not a named profile
        run: ./scripts/e2e.sh
