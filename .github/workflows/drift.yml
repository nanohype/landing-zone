name: Drift Detection

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

# Read-only by default. detect-drift restates the three scopes it needs
# (id-token for OIDC, contents for checkout, issues for the drift report), so the
# discover job — which only lists files — holds neither the OIDC token nor the
# ability to open issues.
permissions:
  contents: read

jobs:
  # secrets.X and vars.X resolve from the job's environment first, then the
  # repository, then the organization. This job declares no environment, so it
  # sees only the repository and organization values. DRIFT_PLAN_ROLE_ARNS must
  # exist on the `drift` GitHub Environment alone, as a secret:
  #   - a repository or organization SECRET of that name is what select-accounts
  #     and detect-drift would read if the environment ever lost its own, and it
  #     is readable by every workflow in the repository, not only by jobs the
  #     environment's main-only branch policy admits;
  #   - a repository or organization VARIABLE of that name is how this map used
  #     to be stored, and a variable is not masked: any job that printed it would
  #     publish every account id it holds.
  # Only whether each is set reaches the step, as `true` or `false`, so this job
  # prints neither value even when one is set. It needs no environment, so it
  # costs no approval and runs from any branch.
  refuse-inherited-config:
    name: Refuse repository-level DRIFT_PLAN_ROLE_ARNS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require DRIFT_PLAN_ROLE_ARNS to be a drift-environment secret only
        # secrets-outside-env is this job's purpose, not a leak: reading the
        # secret with no environment is the only way to see whether a
        # repository- or organization-level one exists (listing secrets needs
        # an admin token), and only the comparison's true/false reaches the step.
        env:
          INHERITED_SECRET: ${{ secrets.DRIFT_PLAN_ROLE_ARNS != '' }} # zizmor: ignore[secrets-outside-env]
          INHERITED_VARIABLE: ${{ vars.DRIFT_PLAN_ROLE_ARNS != '' }}
        run: |
          failed=0
          if [ "$INHERITED_SECRET" != "false" ]; then
            echo "::error title=DRIFT_PLAN_ROLE_ARNS is a repository or organization secret::DRIFT_PLAN_ROLE_ARNS is set as a repository or organization secret, which every workflow in the repository can read and which the drift jobs would fall back to. Delete it there (gh secret delete DRIFT_PLAN_ROLE_ARNS --repo <owner>/<repo>) and keep it only on the drift GitHub Environment (see docs/operations.md)."
            failed=1
          fi
          if [ "$INHERITED_VARIABLE" != "false" ]; then
            echo "::error title=DRIFT_PLAN_ROLE_ARNS is a repository or organization variable::DRIFT_PLAN_ROLE_ARNS is set as a repository or organization variable. Variables are not masked, so its account ids could reach the public Actions logs. Delete it (gh variable delete DRIFT_PLAN_ROLE_ARNS --repo <owner>/<repo>) and store the map as a secret on the drift GitHub Environment instead (see docs/operations.md)."
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "DRIFT_PLAN_ROLE_ARNS is set at neither repository nor organization level, as a secret or as a variable."

  # Auto-discovers the drift matrix from the working tree, mirroring ci.yml's
  # discover job, so a new production/staging live entry starts getting watched
  # without a workflow edit once its account has a plan role (see
  # select-accounts). The matrix is every
  # live/<cloud>/<account>/<region>/<env>/<component>/terragrunt.hcl whose env is
  # production or staging — the two long-lived deployed environments (development is
  # ephemeral, org/hub are management/fleet control planes covered by their own
  # bring-up). Uses `git ls-files` so gitignored caches are excluded by construction.
  discover:
    name: Discover Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: matrix
        run: |
          matrix=$(
            git ls-files live/ \
            | grep '/terragrunt\.hcl$' \
            | jq -R -s -c '
                split("\n")
                | map(select(length > 0))
                | map(split("/"))
                | map({
                    cloud: .[1],
                    account: .[2],
                    region: .[3],
                    env: .[4],
                    component: .[5]
                  })
                | map(select(.env == "production" or .env == "staging"))
              '
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Chooses the leaves to plan. The matrix spans every account directory under
  # live/aws/ that holds a production or staging leaf, and root.hcl assumes no
  # role: the backend and the provider both act as the credential detect-drift
  # configures, so a leaf can only be planned with a credential in its own
  # account. DRIFT_PLAN_ROLE_ARNS is a secret on the `drift` GitHub Environment
  # holding a single-line JSON object that maps each account directory to the
  # read-only plan role github-oidc creates in that account (its plan_role_arn
  # output), for example
  # {"workload-staging":"arn:aws:iam::222222222222:role/github-actions-plan"}.
  #
  # A leaf whose account directory has no entry is not planned: it is skipped and
  # named in the run summary, so drift detection can be armed one account at a
  # time. An entry that is not an IAM role ARN, or whose key names no account
  # directory the matrix plans (a misspelt key, or an account whose last
  # production or staging leaf was removed), is reported and left out, and
  # report-config-errors fails the run after the accounts mapped correctly have
  # been planned. So a bad entry is never quiet and never stops the good ones.
  # The run fails before planning anything only when the secret is unset, spans
  # several lines, is not a JSON object, or leaves no account to plan: a
  # scheduled run that checked no account must not report "no drift".
  #
  # `environment: drift` is what makes the secret readable here, and the
  # environment's deployment-branch policy admits main only, so a dispatch from
  # any other branch stops at this job. refuse-inherited-config runs first, so
  # the value read here can only be the environment's own.
  #
  # The repository is public, and the role ARNs carry real account ids. The
  # secret reaches this step through its env block, which the runner prints as
  # `***` (a secret is masked whole). The step's first command,
  # scripts/mask-drift-role-map.sh, registers every account id and every role
  # ARN in it with ::add-mask::, so nothing this step prints afterwards can
  # carry one either. The matrix this job hands on carries account directory
  # names and no role value: the runner drops any job output containing a
  # masked value ("Skip output ... since it may contain secret"), so detect-drift
  # reads its role from the secret itself. Everything this job writes to an
  # annotation or the run summary names account directories, never values, and
  # goes through jq's `redact`, which replaces any run of twelve or more digits
  # with <account-id>, so even a key that is an account id is not echoed in the
  # summary, which the masker does not reach.
  select-accounts:
    name: Select accounts with a plan role
    needs: [refuse-inherited-config, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: drift
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      config_error: ${{ steps.select.outputs.config_error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pair each leaf with its account's plan role
        id: select
        env:
          DRIFT_PLAN_ROLE_ARNS: ${{ secrets.DRIFT_PLAN_ROLE_ARNS }}
          LEAVES: ${{ needs.discover.outputs.matrix }}
        run: |
          # First: mask every id and role ARN, and refuse an unset or multi-line
          # value, before anything else can print.
          bash "$GITHUB_WORKSPACE/scripts/mask-drift-role-map.sh"
          ROLE_ARNS="$DRIFT_PLAN_ROLE_ARNS"

          if ! printf '%s' "$ROLE_ARNS" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error title=DRIFT_PLAN_ROLE_ARNS is not a JSON object::Drift detection cannot run: DRIFT_PLAN_ROLE_ARNS must be a JSON object mapping account directory to plan role ARN, for example {\"workload-staging\":\"arn:aws:iam::<account>:role/github-actions-plan\"}."
            exit 1
          fi

          # Prepended to every jq program below. `redact` is for what is printed;
          # `is_role_arn` is the one role-ARN shape every job accepts, anchored at
          # both ends of the string so a value carrying a line break is not one.
          defs='def redact: gsub("[0-9]{12,}"; "<account-id>");
                def is_role_arn: type == "string" and test("\\Aarn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+\\z");'

          # Each query lists keys, never values, and redacts them. A failed jq is
          # reported as its own error rather than read as an empty list, because an
          # empty list is the passing answer.
          if ! malformed=$(jq -n -r --argjson roles "$ROLE_ARNS" "$defs"'
              $roles | to_entries[] | select(.value | is_role_arn | not) | .key | redact
            '); then
            echo "::error::DRIFT_PLAN_ROLE_ARNS could not be checked, so no leaf was planned."
            exit 1
          fi
          if ! unknown=$(jq -n -r --argjson roles "$ROLE_ARNS" --argjson leaves "$LEAVES" "$defs"'
              [$leaves[].account] as $planned
              | $roles | keys[] | select(IN($planned[]) | not) | redact
            '); then
            echo "::error::DRIFT_PLAN_ROLE_ARNS could not be compared with the matrix, so no leaf was planned."
            exit 1
          fi

          config_error=false
          if [ -n "$malformed" ]; then
            echo "::error title=DRIFT_PLAN_ROLE_ARNS holds a value that is not a role ARN::Each value must be an IAM role ARN (arn:aws:iam::<account>:role/<name>). Left out, so those accounts are skipped: $(printf '%s' "$malformed" | paste -sd ' ' -)."
            config_error=true
          fi
          if [ -n "$unknown" ]; then
            echo "::error title=DRIFT_PLAN_ROLE_ARNS names an account drift does not plan::Each key must be an account directory under live/aws/ that holds a production or staging leaf. Left out: $(printf '%s' "$unknown" | paste -sd ' ' -)."
            config_error=true
          fi

          # The account directories with a valid role, as names only. No role
          # value leaves this step.
          if ! accounts=$(jq -n -c --argjson roles "$ROLE_ARNS" --argjson leaves "$LEAVES" "$defs"'
              [$leaves[].account] as $planned
              | [$roles | to_entries[] | select((.value | is_role_arn) and (.key | IN($planned[]))) | .key]
            '); then
            echo "::error::DRIFT_PLAN_ROLE_ARNS could not be paired with the matrix, so no leaf was planned."
            exit 1
          fi
          matrix=$(jq -n -c --argjson accounts "$accounts" --argjson leaves "$LEAVES" '
              $leaves | map(select(.account | IN($accounts[])))
            ')
          skipped=$(jq -n -r --argjson accounts "$accounts" --argjson leaves "$LEAVES" "$defs"'
              [$leaves[] | select(.account | IN($accounts[]) | not) | .account] | unique | .[] | redact
            ')

          if [ "$matrix" = "[]" ] || [ -z "$matrix" ]; then
            echo "::error title=No leaf to plan::DRIFT_PLAN_ROLE_ARNS maps no account directory to a valid plan role, so no leaf would be planned and no drift checked."
            exit 1
          fi

          {
            echo "## Drift accounts"
            echo
            echo "Planned with the account's plan role:"
            echo
            jq -n -r --argjson accounts "$accounts" "$defs"'$accounts | unique[] | "- `\(.)`" | redact'
            if [ -n "$skipped" ]; then
              echo
              echo "Skipped, because DRIFT_PLAN_ROLE_ARNS has no valid plan role for the account. These leaves were not checked for drift:"
              echo
              printf '%s' "$LEAVES" | jq -r --argjson accounts "$accounts" "$defs"'
                  map(select(.account | IN($accounts[]) | not))
                  | group_by(.account)[]
                  | "- `\(.[0].account)`: " + (map("`\(.env)/\(.component)`") | join(", ")) | redact
                '
            fi
            if [ "$config_error" = true ]; then
              echo
              echo "DRIFT_PLAN_ROLE_ARNS has entries that were left out (see the errors on this run). The run fails after the accounts above are planned."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$skipped" ]; then
            while IFS= read -r account; do
              echo "::notice title=Drift not checked for ${account}::DRIFT_PLAN_ROLE_ARNS has no valid plan role for account directory ${account}, so its leaves were skipped. They are listed in the run summary."
            done <<< "$skipped"
          fi

          {
            echo "matrix=$matrix"
            echo "config_error=$config_error"
          } >> "$GITHUB_OUTPUT"

  detect-drift:
    # The account directory is in the name, as it is in the issue titles below:
    # network, backup and workload-production can each hold a production leaf of
    # the same component (github-oidc), and without it they would share a name.
    name: Drift Check (${{ matrix.account }}/${{ matrix.env }}/${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: select-accounts
    # The read-only plan role of the leaf's own account. Declaring
    # `environment: drift` makes the OIDC token present
    # repo:<org>/<repo>:environment:drift — the only sub a staging or production
    # plan role trusts (github-oidc's plan_allowed_subject_claims validation
    # requires exactly that claim in those environments) — instead of the bare
    # branch claim (ref:refs/heads/main) a scheduled run would otherwise carry,
    # which no role trusts. It is also what makes the DRIFT_PLAN_ROLE_ARNS secret
    # readable. The environment admits main only, so neither the token nor the
    # secret reaches another branch. It is deliberately not `plan`: ci.yml's PR
    # plan job declares that environment from any branch, and its role is the
    # development account's.
    environment: drift
    # Grant the OIDC token permission at the JOB level, mirroring ci.yml's plan
    # job. aws-actions/configure-aws-credentials needs id-token:write to mint the
    # web-identity token; without it the step fails with "Could not load
    # credentials from any providers". A job-level permissions block replaces the
    # workflow-level one for this job, so all three scopes are restated here —
    # id-token:write for OIDC, contents:read for checkout, issues:write for the
    # "Report drift or plan error" step that opens/updates the issue.
    permissions:
      id-token: write
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-accounts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The first step that receives the secret. Its first command masks every
      # account id and role ARN in it (all accounts', not only this leaf's), so
      # from there on this job's log carries none of them: not this step's
      # output, not the role-to-assume input the credentials step prints, not
      # the env blocks of the steps below, and not the plan output, which names
      # the state bucket and role ARNs. Masks are per job, so select-accounts'
      # masking does not cover this one.
      #
      # The role comes from the secret here rather than through the matrix,
      # because the runner drops a job output that contains a masked value. The
      # role and account id leave this step as step outputs, which stay inside
      # the job and print as `***`.
      - name: Read this account's plan role
        id: role
        env:
          DRIFT_PLAN_ROLE_ARNS: ${{ secrets.DRIFT_PLAN_ROLE_ARNS }}
          ACCOUNT_DIR: ${{ matrix.account }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/mask-drift-role-map.sh"

          # The same role-ARN shape select-accounts accepted. select-accounts only
          # put this leaf in the matrix because its entry had one, so a miss here
          # means the secret changed between the two jobs.
          if ! role_arn=$(printf '%s' "$DRIFT_PLAN_ROLE_ARNS" | jq -r --arg account "$ACCOUNT_DIR" '
              .[$account]
              | select(type == "string" and test("\\Aarn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+\\z"))
            ') || [ -z "$role_arn" ]; then
            echo "::error title=No plan role for ${ACCOUNT_DIR}::DRIFT_PLAN_ROLE_ARNS has no valid plan role for account directory ${ACCOUNT_DIR}, although select-accounts found one; the secret changed during the run. Re-run the workflow."
            exit 1
          fi
          # The leaf's account id is its plan role's account: the ARN's account
          # segment, which the Plan step exports as TERRAGRUNT_ACCOUNT_ID.
          account_id=$(printf '%s' "$role_arn" | cut -d: -f5)
          {
            echo "role_arn=$role_arn"
            echo "account_id=$account_id"
          } >> "$GITHUB_OUTPUT"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: "1.13.9"
      - uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3
        with:
          # terragrunt-action@v3 runs tofu inside its own container, so it needs
          # tofu_version told to it directly — the setup-opentofu step above only
          # installs tofu on the runner. Without this the action aborts every run
          # ("No mise.toml found, so 'tofu_version' is required").
          tofu_version: "1.13.9"
          tg_version: "1.2.2"

      # continue-on-error, so that a role this job cannot assume reaches the Plan
      # step and is reported as a drift check error. The likely causes are the
      # account's github-oidc leaf not applied yet (the role does not exist), a
      # trust that does not admit this job's OIDC subject, which is
      # repo:<org>/<repo>:environment:drift, or a DRIFT_PLAN_ROLE_ARNS entry
      # naming the wrong role. Without continue-on-error the job would stop here. It would be red, but it would file no
      # drift-error issue, which is the alert docs/operations.md promises for a
      # leaf that could not be checked. The Plan step records the failure as exit
      # code 1, so the run still ends red (see "Fail on plan error").
      - name: Configure AWS credentials
        id: creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ steps.role.outputs.role_arn }}
          aws-region: ${{ matrix.region }}
          # Already masked by the "Read this account's plan role" step; stated
          # so the action's own handling cannot be the one place it is not.
          mask-aws-account-id: true

      # `terragrunt plan -detailed-exitcode` returns three distinct codes, and they
      # mean three different things — conflating them is how drift detection goes
      # dark on the failure mode most likely to actually occur:
      #   0 — no changes (in sync). Nothing to report.
      #   1 — the plan ERRORED (expired auth, a broken/renamed provider, an
      #       unresolvable dependency). This is NOT "no drift" — it means we never
      #       got a real answer. Alert distinctly and fail the job so it goes red.
      #   2 — real drift (the live resources differ from the committed config).
      #       Open/update the drift issue; the job stays green (drift is tracked,
      #       not a CI failure).
      # `set +e` keeps the step from aborting on code 1 before we can branch on it;
      # PIPESTATUS[0] captures terragrunt's code through the `tee` pipe.
      #
      # A failed "Configure AWS credentials" is recorded as code 1 without running
      # terragrunt: plan.txt then holds a message naming the account directory
      # (never the role ARN), and the error report and the red run follow.
      #
      # The leaf's account id is its plan role's account: the ARN's account
      # segment, read by the "Read this account's plan role" step and exported
      # here as the TERRAGRUNT_ACCOUNT_ID root.hcl reads to name the state
      # bucket, the same injection ci.yml's plan job and scripts/e2e.sh use. The
      # credential configured above came from the same ARN, so the bucket and the
      # provider are in one account by construction. The plan output this step
      # tees into the log names that bucket and, in an access error, role ARNs;
      # both print as `***`, because the role step masked them.
      #
      # -lock=false: root.hcl sets use_lockfile = true, so a plan that locks writes
      # a .tflock object beside the state. The plan role is read-only
      # (ReadOnlyAccess), so it cannot write that object, and every plan would
      # fail acquiring the lock. Skipping the lock is safe here because this plan
      # writes nothing and nothing applies its result: it reads state, and its
      # output is a report rather than a saved plan, so it never contends with an
      # apply. An apply running at the same moment can only make one report
      # stale, which the next scheduled run corrects. A plan that errors still
      # fails the job (see "Fail on plan error").
      - name: Plan
        id: plan
        working-directory: live/${{ matrix.cloud }}/${{ matrix.account }}/${{ matrix.region }}/${{ matrix.env }}/${{ matrix.component }}
        env:
          ACCOUNT_ID: ${{ steps.role.outputs.account_id }}
          CREDS_OUTCOME: ${{ steps.creds.outcome }}
          ACCOUNT_DIR: ${{ matrix.account }}
        run: |
          if [ "$CREDS_OUTCOME" != "success" ]; then
            {
              echo "No plan ran: the plan role for account directory ${ACCOUNT_DIR} could not be assumed (the \"Configure AWS credentials\" step failed)."
              echo
              echo "Check, in order:"
              echo "- the account's github-oidc leaf has been applied, so its plan role exists;"
              echo "- the plan role's trust admits this job's OIDC subject (detect-drift declares the \"drift\" environment, so plan_allowed_subject_claims must be [\"environment:drift\"]);"
              echo "- the DRIFT_PLAN_ROLE_ARNS entry for ${ACCOUNT_DIR} is that account's plan_role_arn output."
              echo
              echo "The AWS error is in the \"Configure AWS credentials\" step of this job. See docs/operations.md, drift.yml."
            } > plan.txt
            msg=$(printf 'Could not assume the plan role for account directory %s, so nothing was planned; reported as a drift check error.' "$ACCOUNT_DIR" \
              | python3 "$GITHUB_WORKSPACE/scripts/redact-account-ids.py")
            echo "::error title=Plan role not assumed::${msg}"
            echo "exitcode=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::This leaf's plan role carried no account id, so its state bucket is unknown."
            exit 1
          fi
          export TERRAGRUNT_ACCOUNT_ID="$ACCOUNT_ID"

          set +e
          terragrunt plan -lock=false -detailed-exitcode -no-color 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # The plan output carries real account ids (the state bucket
      # <account_id>-<region>-tfstate in backend and lock errors, role ARNs in
      # access errors), and an issue on this public repository is published the
      # moment it is filed. The log masking above does not reach an issue: it
      # rewrites what the runner prints, not what a step writes to a file or
      # sends to the API. So nothing reads plan.txt for an issue: the report
      # below reads plan.redacted.txt, which scripts/redact-account-ids.py writes
      # here with every id in DRIFT_PLAN_ROLE_ARNS, and any other standalone run
      # of twelve digits, replaced by <account-id>. The secret arrives through the
      # environment (its env block prints as `***`), never expanded into a script.
      #
      # The redactor runs its self-test first, then redacts with --require-ids: a
      # leaf is only planned with a role ARN from the secret, so it always holds
      # an id, and none means it did not arrive. If either fails, this step
      # fails, the report is skipped, and the job ends red without publishing
      # anything.
      - name: Redact account ids from the plan output
        if: steps.plan.outputs.exitcode == '1' || steps.plan.outputs.exitcode == '2'
        working-directory: live/${{ matrix.cloud }}/${{ matrix.account }}/${{ matrix.region }}/${{ matrix.env }}/${{ matrix.component }}
        env:
          DRIFT_PLAN_ROLE_ARNS: ${{ secrets.DRIFT_PLAN_ROLE_ARNS }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/redact-account-ids.py" --self-test
          python3 "$GITHUB_WORKSPACE/scripts/redact-account-ids.py" --require-ids < plan.txt > plan.redacted.txt

      # Drift (exit 2) opens or updates an issue labelled `drift`. A plan ERROR
      # (exit 1) is its own alert, with a distinct title and the `drift-error`
      # label, so it never reads as "no drift". Both reuse an open issue with the
      # same title, so a persistently drifting or broken component does not spawn
      # an issue per run. The title names the account directory as well as the
      # leaf, because the same env/component pair can exist in several accounts.
      # The lookup pages through every open issue with the label: one trust
      # misconfiguration across a few accounts files a drift-error issue per
      # leaf, more than the 30 a single page returns, and a lookup that missed
      # one would file a duplicate every run.
      #
      # Every value reaches the script through the environment. The title and the
      # whole body, not only the plan text, go through a second redaction pass
      # with the same two rules as scripts/redact-account-ids.py before anything
      # is published, so no field of an issue can carry an account id.
      - name: Report drift or plan error
        if: steps.plan.outputs.exitcode == '1' || steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
          PLAN_FILE: live/${{ matrix.cloud }}/${{ matrix.account }}/${{ matrix.region }}/${{ matrix.env }}/${{ matrix.component }}/plan.redacted.txt
          ACCOUNT_DIR: ${{ matrix.account }}
          REGION: ${{ matrix.region }}
          ENVIRONMENT: ${{ matrix.env }}
          COMPONENT: ${{ matrix.component }}
          DRIFT_PLAN_ROLE_ARNS: ${{ secrets.DRIFT_PLAN_ROLE_ARNS }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env;

            // Every twelve-digit run in the secret's raw text, as the redaction
            // step reads it. A secret holding no id fails the step rather than
            // publishing with only the pattern pass, matching that step's
            // --require-ids.
            const knownIds = [...new Set((env.DRIFT_PLAN_ROLE_ARNS || '').match(/[0-9]{12}/g) || [])];
            if (knownIds.length === 0) throw new Error('DRIFT_PLAN_ROLE_ARNS holds no account id');
            const redact = (text) => {
              for (const id of knownIds) text = text.split(id).join('<account-id>');
              return text.replace(/(?<![0-9])[0-9]{12}(?![0-9])/g, '<account-id>');
            };

            const plan = fs.readFileSync(env.PLAN_FILE, 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... truncated' : plan;

            const drift = env.EXITCODE === '2';
            const label = drift ? 'drift' : 'drift-error';
            const leaf = `${env.ACCOUNT_DIR}/${env.ENVIRONMENT}/${env.COMPONENT}`;
            const details = `**Account:** ${env.ACCOUNT_DIR}\n**Region:** ${env.REGION}\n**Environment:** ${env.ENVIRONMENT}\n**Component:** ${env.COMPONENT}\n**Detected:** ${new Date().toISOString()}`;
            const title = redact(drift ? `Drift detected: ${leaf}` : `Drift check error: ${leaf}`);
            const body = redact(drift
              ? `## Drift Detection Report\n\n${details}\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`
              : `## Drift Check ERROR\n\nThe drift plan for this component failed to run — this is **not** "no drift", it means the check could not determine drift (a plan role that could not be assumed, expired auth, a broken provider, an unresolvable dependency). Resolve this before trusting the drift status of this component.\n\n${details}\n\n<details><summary>Plan error output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`);

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: [label],
              });
            }

      # Fail the job on a plan error so the run goes red, not green-with-no-drift.
      # Real drift (exit 2) is reported above and intentionally leaves the job green.
      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        env:
          ACCOUNT_DIR: ${{ matrix.account }}
          ENVIRONMENT: ${{ matrix.env }}
          COMPONENT: ${{ matrix.component }}
        run: |
          echo "::error::Drift plan for ${ACCOUNT_DIR}/${ENVIRONMENT}/${COMPONENT} errored (exit 1) — see the 'Drift check error' issue."
          exit 1

  # Fails the run when select-accounts left a DRIFT_PLAN_ROLE_ARNS entry out.
  # It runs after detect-drift, whatever that job's result, so the accounts mapped
  # correctly are planned first and a bad entry still turns the run red.
  report-config-errors:
    name: DRIFT_PLAN_ROLE_ARNS has entries that were left out
    needs: [select-accounts, detect-drift]
    if: always() && needs.select-accounts.outputs.config_error == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail the run
        run: |
          echo "::error::DRIFT_PLAN_ROLE_ARNS has entries that are not role ARNs or that name no account directory drift plans. select-accounts names them and left them out; fix or remove them (see docs/operations.md)."
          exit 1
