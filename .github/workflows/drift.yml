name: Drift Detection

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

# Read-only by default. detect-drift restates the three scopes it needs
# (id-token for OIDC, contents for checkout, issues for the drift report), so the
# discover job — which only lists files — holds neither the OIDC token nor the
# ability to open issues.
permissions:
  contents: read

jobs:
  # Auto-discovers the drift matrix from the working tree, mirroring ci.yml's
  # discover job, so a new production/staging live entry starts getting watched
  # without a workflow edit. A leaf in an account directory TERRAGRUNT_ACCOUNT_IDS
  # does not list reports a plan error until the map has an entry for it (see
  # require-config). The matrix is every
  # live/<cloud>/<account>/<region>/<env>/<component>/terragrunt.hcl whose env is
  # production or staging — the two long-lived deployed environments (development is
  # ephemeral, org/hub are management/fleet control planes covered by their own
  # bring-up). Uses `git ls-files` so gitignored caches are excluded by construction.
  discover:
    name: Discover Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: matrix
        run: |
          matrix=$(
            git ls-files live/ \
            | grep '/terragrunt\.hcl$' \
            | jq -R -s -c '
                split("\n")
                | map(select(length > 0))
                | map(split("/"))
                | map({
                    cloud: .[1],
                    account: .[2],
                    region: .[3],
                    env: .[4],
                    component: .[5]
                  })
                | map(select(.env == "production" or .env == "staging"))
              '
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Configuration guard. Unlike ci.yml's plan job, which skips green on a PR where
  # nothing is wired up, this workflow exists only to talk to AWS: a scheduled run
  # with no role has detected nothing, and skipping to green reports every
  # unattended run as "no drift" while it checked no account at all. So this job
  # fails the run, and detect-drift (which needs it) does not start, unless both
  # repository variables are set:
  #
  #   AWS_ROLE_ARN            the OIDC plan role detect-drift assumes.
  #   TERRAGRUNT_ACCOUNT_IDS  a JSON object mapping each account directory under
  #                           live/aws/ to its 12-digit account id, as a string so
  #                           a leading zero survives, for example
  #                           {"workload-staging":"222222222222","network":"444444444444"}.
  #
  # The map exists because the matrix spans several accounts. root.hcl names the
  # state bucket after TERRAGRUNT_ACCOUNT_ID and falls back to the tracked
  # account.hcl placeholder when it is unset, so a leaf planned without its real id
  # dies at backend init against a bucket in an account that does not exist. One
  # id cannot serve leaves in different accounts, so each leaf looks up its own
  # account directory in the Plan step. A map that is not a JSON object would fail
  # every leaf with a misleading "no entry" error, so it is rejected here once.
  # An account directory missing from a valid map fails only that account's
  # leaves, so the accounts the map does list keep being checked.
  require-config:
    name: Require AWS_ROLE_ARN and TERRAGRUNT_ACCOUNT_IDS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when the drift role or account ids are not configured
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          ACCOUNT_IDS: ${{ vars.TERRAGRUNT_ACCOUNT_IDS }}
        run: |
          unset_vars=0
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error title=AWS_ROLE_ARN is not set::Drift detection cannot run: the AWS_ROLE_ARN repository variable (Settings > Secrets and variables > Actions > Variables) is unset, so no account was planned and no drift was checked. Set it to the OIDC plan role drift.yml assumes (see docs/operations.md)."
            unset_vars=1
          fi
          if [ -z "$ACCOUNT_IDS" ]; then
            echo "::error title=TERRAGRUNT_ACCOUNT_IDS is not set::Drift detection cannot run: the TERRAGRUNT_ACCOUNT_IDS repository variable is unset, so no leaf can name its state bucket. Set it to a JSON object mapping each account directory under live/aws/ to its account id (see docs/operations.md)."
            unset_vars=1
          fi
          if [ "$unset_vars" -ne 0 ]; then
            exit 1
          fi

          if ! printf '%s' "$ACCOUNT_IDS" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error title=TERRAGRUNT_ACCOUNT_IDS is not a JSON object::Drift detection cannot run: TERRAGRUNT_ACCOUNT_IDS must be a JSON object mapping account directory to account id, for example {\"workload-staging\":\"222222222222\"}."
            exit 1
          fi
          echo "AWS_ROLE_ARN and TERRAGRUNT_ACCOUNT_IDS are set."

  detect-drift:
    name: Drift Check (${{ matrix.env }}/${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [discover, require-config]
    # The read-only plan role, the same one ci.yml's plan job assumes. Declaring
    # `environment: plan` makes the OIDC token present
    # repo:<org>/<repo>:environment:plan — the only sub the plan role trusts —
    # instead of the bare branch claim (ref:refs/heads/main) a scheduled run would
    # otherwise carry, which neither the plan role nor the deploy role trusts. If
    # the `plan` environment requires reviewers, every scheduled run waits for an
    # approval before any leaf is planned.
    environment: plan
    # Grant the OIDC token permission at the JOB level, mirroring ci.yml's plan
    # job. aws-actions/configure-aws-credentials needs id-token:write to mint the
    # web-identity token; without it the step fails with "Could not load
    # credentials from any providers". A job-level permissions block replaces the
    # workflow-level one for this job, so all three scopes are restated here —
    # id-token:write for OIDC, contents:read for checkout, issues:write for the
    # Report-drift step that opens/updates the drift issue.
    permissions:
      id-token: write
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: "1.13.9"
      - uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3
        with:
          # terragrunt-action@v3 runs tofu inside its own container, so it needs
          # tofu_version told to it directly — the setup-opentofu step above only
          # installs tofu on the runner. Without this the action aborts every run
          # ("No mise.toml found, so 'tofu_version' is required").
          tofu_version: "1.13.9"
          tg_version: "1.2.2"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      # `terragrunt plan -detailed-exitcode` returns three distinct codes, and they
      # mean three different things — conflating them is how drift detection goes
      # dark on the failure mode most likely to actually occur:
      #   0 — no changes (in sync). Nothing to report.
      #   1 — the plan ERRORED (expired auth, a broken/renamed provider, an
      #       unresolvable dependency). This is NOT "no drift" — it means we never
      #       got a real answer. Alert distinctly and fail the job so it goes red.
      #   2 — real drift (the live resources differ from the committed config).
      #       Open/update the drift issue; the job stays green (drift is tracked,
      #       not a CI failure).
      # `set +e` keeps the step from aborting on code 1 before we can branch on it;
      # PIPESTATUS[0] captures terragrunt's code through the `tee` pipe.
      #
      # Before planning, the leaf's account id is resolved from
      # TERRAGRUNT_ACCOUNT_IDS by its account directory and exported as the
      # TERRAGRUNT_ACCOUNT_ID root.hcl reads, the same injection ci.yml's plan job
      # and scripts/e2e.sh use. root.hcl assumes no role, so the backend and the
      # provider both run as the credential configured above, and that credential
      # has to be in the leaf's own account. A credential in another account either
      # fails at backend init or, where a bucket policy lets it read the state,
      # refreshes every resource in the wrong account and reports the whole leaf as
      # drift. So a leaf whose account is not the credential's account is reported
      # as a plan error, through the same path as a failed plan, and never planned.
      #
      # plan.txt becomes the body of a drift-error issue on a public repository, so
      # these messages name the account directory and never an account id. The
      # STS error goes to the job log only.
      - name: Plan
        id: plan
        working-directory: live/${{ matrix.cloud }}/${{ matrix.account }}/${{ matrix.region }}/${{ matrix.env }}/${{ matrix.component }}
        env:
          ACCOUNT: ${{ matrix.account }}
          ACCOUNT_IDS: ${{ vars.TERRAGRUNT_ACCOUNT_IDS }}
        run: |
          # Writes the reason where the Report plan error step reads it and records
          # exit code 1, so that step and Fail on plan error both run. The step
          # itself exits 0: a failed step would skip both of them.
          plan_error() {
            printf '%s\n' "$1" | tee plan.txt
            echo "exitcode=1" >> "$GITHUB_OUTPUT"
          }

          account_id=$(printf '%s' "$ACCOUNT_IDS" | jq -r --arg account "$ACCOUNT" '.[$account] | strings' 2>/dev/null || true)
          if ! [[ "$account_id" =~ ^[0-9]{12}$ ]]; then
            plan_error "TERRAGRUNT_ACCOUNT_IDS has no 12-digit account id for account directory ${ACCOUNT}, so this leaf's state bucket cannot be named. Add an entry for ${ACCOUNT}."
            exit 0
          fi

          if ! caller_account=$(aws sts get-caller-identity --query Account --output text 2>"$RUNNER_TEMP/sts.err"); then
            cat "$RUNNER_TEMP/sts.err" >&2
            plan_error "Could not read the account of the assumed AWS_ROLE_ARN credential, so this leaf was not planned. The STS error is in the job log."
            exit 0
          fi
          if [ "$caller_account" != "$account_id" ]; then
            plan_error "The assumed AWS_ROLE_ARN credential is not in the account TERRAGRUNT_ACCOUNT_IDS maps to ${ACCOUNT}. This leaf can only be planned with a credential in its own account, so it was not planned."
            exit 0
          fi

          export TERRAGRUNT_ACCOUNT_ID="$account_id"
          set +e
          terragrunt plan -detailed-exitcode -no-color 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Report drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('live/${{ matrix.cloud }}/${{ matrix.account }}/${{ matrix.region }}/${{ matrix.env }}/${{ matrix.component }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... truncated' : plan;

            const title = `Drift detected: ${{ matrix.env }}/${{ matrix.component }}`;
            const body = `## Drift Detection Report\n\n**Account:** ${{ matrix.account }}\n**Region:** ${{ matrix.region }}\n**Environment:** ${{ matrix.env }}\n**Component:** ${{ matrix.component }}\n**Detected:** ${new Date().toISOString()}\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`;

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift',
            });

            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['drift'],
              });
            }

      # A plan ERROR (exit 1) is its own alert — a distinct title + label so it
      # never reads as "no drift". Uses the same open/update idiom as the drift
      # report so a persistently-broken component doesn't spawn an issue per run.
      - name: Report plan error
        if: steps.plan.outputs.exitcode == '1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('live/${{ matrix.cloud }}/${{ matrix.account }}/${{ matrix.region }}/${{ matrix.env }}/${{ matrix.component }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... truncated' : plan;

            const title = `Drift check error: ${{ matrix.env }}/${{ matrix.component }}`;
            const body = `## Drift Check ERROR\n\nThe drift plan for this component failed to run — this is **not** "no drift", it means the check could not determine drift (expired auth, a broken provider, an unresolvable dependency). Resolve this before trusting the drift status of this component.\n\n**Account:** ${{ matrix.account }}\n**Region:** ${{ matrix.region }}\n**Environment:** ${{ matrix.env }}\n**Component:** ${{ matrix.component }}\n**Detected:** ${new Date().toISOString()}\n\n<details><summary>Plan error output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift-error',
            });

            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['drift-error'],
              });
            }

      # Fail the job on a plan error so the run goes red, not green-with-no-drift.
      # Real drift (exit 2) is reported above and intentionally leaves the job green.
      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "::error::Drift plan for ${{ matrix.env }}/${{ matrix.component }} errored (exit 1) — see the 'Drift check error' issue."
          exit 1
