name: Destroy

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Target account (e.g., workload-development, workload-staging)"
        required: true
        type: string
        default: "workload-development"
      region:
        description: "Target region (e.g., us-east-1)"
        required: true
        type: string
        default: "us-east-1"
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - development
          - staging
      component:
        description: "Component to destroy (e.g., network, cluster, or 'all')"
        required: true
        type: string
        default: "all"
      confirm:
        description: "Type the environment name to confirm"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

# Serialize mutating runs against the same environment/component. The group is shared
# with deploy.yml (same `mutate-<env>-<component>` key) so a destroy can't race a
# deploy of the same target, and two destroys of one target queue rather than both
# tearing down concurrently. cancel-in-progress is false: never abort a destroy
# mid-flight — a partial teardown is worse than a queued one.
concurrency:
  group: mutate-${{ inputs.environment }}-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy ${{ inputs.environment }}/${{ inputs.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    if: inputs.confirm == inputs.environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: "1.11.5"
      - uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3
        with:
          tg_version: "1.0.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Destroy
        working-directory: live/aws/${{ inputs.account }}/${{ inputs.region }}/${{ inputs.environment }}
        # The dispatch input reaches the shell through env, never through ${{ }}
        # inside the script — a ${{ }} expansion is substituted into the script
        # TEXT, so an input carrying shell syntax becomes shell syntax. It matters
        # most here: this job already holds credentials whose whole purpose is
        # deleting infrastructure.
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          if [ "$COMPONENT" = "all" ]; then
            terragrunt run --all --non-interactive -- destroy
          else
            cd "$COMPONENT"
            terragrunt destroy
          fi
