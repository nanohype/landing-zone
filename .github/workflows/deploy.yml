name: Deploy

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Target account (e.g., workload-development, workload-staging, workload-production, management)"
        required: true
        type: string
        default: "workload-development"
      region:
        description: "Target region (e.g., us-east-1)"
        required: true
        type: string
        default: "us-east-1"
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      component:
        description: "Component to deploy (e.g., network, cluster, or 'all')"
        required: true
        type: string
        default: "all"
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

# Serialize mutating runs against the same environment/component so two dispatched
# applies (or an apply racing a destroy) can't plan-and-write concurrently against one
# target's state. The group is shared with destroy.yml (same `mutate-<env>-<component>`
# key) so deploy and destroy of the same target queue behind each other too.
# cancel-in-progress is false: never abort an apply mid-flight — let it finish and run
# the next dispatch after.
concurrency:
  group: mutate-${{ inputs.environment }}-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.action }} ${{ inputs.environment }}/${{ inputs.component }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: "1.11.5"
      - uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3
        with:
          tg_version: "1.0.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Run Terragrunt
        working-directory: live/aws/${{ inputs.account }}/${{ inputs.region }}/${{ inputs.environment }}
        # Dispatch inputs reach the shell through env, never through ${{ }} inside
        # the script. A ${{ }} expansion is substituted into the script TEXT before
        # bash sees it, so an input containing shell syntax becomes shell syntax —
        # `cd ${{ inputs.component }}` with a crafted value runs arbitrary commands
        # under the deploy role's AWS credentials. An env var is a value bash reads,
        # not text bash parses.
        env:
          COMPONENT: ${{ inputs.component }}
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$COMPONENT" = "all" ]; then
            terragrunt run --all --non-interactive -- "$ACTION"
          else
            cd "$COMPONENT"
            terragrunt "$ACTION"
          fi
