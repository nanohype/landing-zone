name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow default is read-only. Every job that needs to write says so at the
# job level, so a new job inherits no ability to comment on a pull request or mint
# an OIDC token — the plan job is the only one that needs either, and it declares
# both itself.
permissions:
  contents: read

jobs:
  placeholders:
    name: Zero-placeholder gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/no-placeholders.sh

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: "1.11.5"
      - run: tofu fmt -check -recursive components/
      - run: tofu fmt -check -recursive modules/
      - run: tofu fmt -check -recursive fleet/
      - uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3
        with:
          tg_version: "1.0.8"
          tofu_version: "1.11.5"
      # `tofu fmt` only covers .tf. The Terragrunt HCL layer (live/ includes,
      # _envcommon, generate blocks) drifts unchecked without this gate.
      - run: terragrunt hcl format --check --diff

  # Auto-discovers the matrices from the working tree so new components and
  # new live entries don't need a workflow edit to start getting their own
  # Validate / Plan check. The validate matrix lists every
  # <root>/<cloud>/<component>/ directory across components/, fleet/, and
  # modules/ (the vend roots and shared modules validate alongside the
  # components); the plan matrix lists every
  # live/<cloud>/<account>/<region>/<env>/<component>/terragrunt.hcl. Both
  # use `git ls-files` so .terraform/, .terragrunt-cache/, and other
  # gitignored paths are excluded by construction.
  discover:
    name: Discover Matrices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      validate: ${{ steps.matrices.outputs.validate }}
      plan: ${{ steps.matrices.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: matrices
        run: |
          validate=$(
            git ls-files components/ fleet/ modules/ \
            | awk -F'/' 'NF >= 3 && $1 != "" && $2 != "" && $3 != "" { print $1 "/" $2 "/" $3 }' \
            | sort -u \
            | jq -R -s -c '
                split("\n")
                | map(select(length > 0))
                | map(split("/"))
                | map({root: .[0], cloud: .[1], component: .[2]})
              '
          )
          plan=$(
            git ls-files live/ \
            | grep '/terragrunt\.hcl$' \
            | jq -R -s -c '
                split("\n")
                | map(select(length > 0))
                | map(split("/"))
                | map({
                    cloud: .[1],
                    account: .[2],
                    region: .[3],
                    env: .[4],
                    component: .[5]
                  })
              '
          )
          echo "validate=$validate" >> "$GITHUB_OUTPUT"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate (${{ matrix.root }}/${{ matrix.cloud }}/${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.validate) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: "1.11.5"
      - name: Init and Validate
        working-directory: ${{ matrix.root }}/${{ matrix.cloud }}/${{ matrix.component }}
        run: |
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate

  # `tofu test` unit tests. They run at command = plan against dummy/mocked
  # providers (no AWS access), so this is a hard gate on security contracts —
  # the workload-identity trust policy staying Pod-Identity-only, and the
  # agent-iam operator's tenant-role writes staying boundary-gated. Auto-discovers
  # every module, component, AND fleet vend root that has a tests/ dir so new
  # tests run without a workflow edit.
  test:
    name: Unit Tests (tofu test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: "1.11.5"
      - name: tofu test
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r dir; do
            found=1
            echo "::group::tofu test — $dir"
            ( cd "$dir" && tofu init -backend=false -input=false -lockfile=readonly && tofu test )
            echo "::endgroup::"
          done < <(git ls-files 'modules/**/tests/*.tftest.hcl' 'components/**/tests/*.tftest.hcl' 'fleet/**/tests/*.tftest.hcl' | xargs -r -n1 dirname | xargs -r -n1 dirname | sort -u)
          if [ "$found" -eq 0 ]; then
            echo "::error::no unit tests discovered under modules/**/tests/, components/**/tests/, or fleet/**/tests/"
            exit 1
          fi

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # tflint --init fetches the aws ruleset from the GitHub releases API. Without a
    # token that call is UNauthenticated (60/hr per runner IP), so on a shared-IP
    # runner it intermittently 403s ("API rate limit exceeded") and reds the build
    # before any linting runs. github.token authenticates it (5000/hr) — read-only,
    # no extra scope.
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6
        with:
          tflint_version: v0.63.1
      - run: tflint --init --config .tflint-aws.hcl
      # tflint rule severities are fixed per rule, not configurable: the documented-
      # variables/outputs rules emit at `notice`, the unused-declaration and
      # required-version/providers rules at `warning`. Gating at `notice` is what makes
      # every enabled rule a hard failure — anything lower lets an undocumented or
      # unused declaration merge silently. The tree is clean at this bar; the uniform
      # envcommon interface variables carry inline tflint-ignore rationale.
      - run: tflint --recursive --config "$PWD/.tflint-aws.hcl" --chdir=components/aws --minimum-failure-severity=notice
      - run: tflint --recursive --config "$PWD/.tflint-aws.hcl" --chdir=fleet/aws --minimum-failure-severity=notice
      - run: tflint --recursive --config "$PWD/.tflint-aws.hcl" --chdir=modules/aws --minimum-failure-severity=notice

  checkov:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          persist-credentials: false
      # HARD gate across every Terraform tree — components, the fleet vend roots,
      # and the shared modules. Any finding not covered by .checkov.yaml fails the
      # build. The deliberately-accepted posture trade-offs (single-region
      # durability, provider-managed encryption, public endpoints with IP
      # allowlists) and checkov false positives are enumerated there as
      # skip-check entries, one line of rationale each — accepted and documented,
      # never silently advisory. The same config_file (its global skip list)
      # applies to all three scans.
      - name: Scan components/aws
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12
        with:
          directory: components/aws/
          framework: terraform
          soft_fail: false
          config_file: .checkov.yaml
      - name: Scan fleet/aws
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12
        with:
          directory: fleet/aws/
          framework: terraform
          soft_fail: false
          config_file: .checkov.yaml
      - name: Scan modules/aws
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12
        with:
          directory: modules/aws/
          framework: terraform
          soft_fail: false
          config_file: .checkov.yaml

  # Credential-less evaluation of every live leaf. `terragrunt render` resolves the
  # full config — includes, functions, and dependency wiring — against mock outputs,
  # so it catches breakage that per-component `tofu validate` cannot see: an
  # unresolvable include function, a config_path that doesn't exist, or a
  # dependency reference into a mock that lacks the key. `--no-auto-init` keeps it
  # fast and offline (dependency output fetches fail straight to the mocks). This is
  # the gate that makes the terragrunt layer fail on a PR instead of at apply time.
  evaluate:
    name: Terragrunt Evaluate (live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TERRAGRUNT_ACCOUNT_ID: "111111111111"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: "1.11.5"
      - uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3
        with:
          tg_version: "1.0.8"
          tofu_version: "1.11.5"
      - name: Render every live leaf
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r leaf; do
            dir=$(dirname "$leaf")
            if ! ( cd "$dir" && TG_NON_INTERACTIVE=true terragrunt render \
                     --format json --no-auto-init >/dev/null 2>/tmp/render.err ); then
              echo "::error::terragrunt render failed for $dir"
              tail -8 /tmp/render.err | sed 's/^/    /'
              fail=1
            fi
          done < <(git ls-files 'live/**/terragrunt.hcl' | grep '/terragrunt\.hcl$')
          if [ "$fail" -ne 0 ]; then
            echo "One or more live leaves failed terragrunt evaluation (see errors above)."
            exit 1
          fi
          echo "All live leaves evaluate cleanly against their mocks."

      # A required input nothing supplies makes a component UNPLANNABLE in every
      # environment it appears in. `governance` carried a `vpc_id` that no
      # _envcommon and no leaf passed and no resource read, so `terragrunt plan`
      # died with "No value for required variable" in development, staging and
      # production — for as long as the variable existed.
      #
      # Nothing caught it. `tofu validate` does not require variable VALUES, the
      # render step above resolves against mocks without checking completeness, and
      # the plan matrix that would have caught it was never armed. This check needs
      # no AWS credentials, no role, no account and no state bucket — the defect was
      # free to find for the whole life of the repo.
      - name: Every leaf has all its required inputs
        run: |
          set -uo pipefail

          # Required inputs deliberately left unsupplied, and why. An entry here is
          # a decision; a variable missing from both this list and the wiring is an
          # unplannable component.
          #   gitops_repo_url — cluster-bootstrap gives it no default ON PURPOSE
          #     (components/aws/cluster-bootstrap/variables.tf:147-153): it must be
          #     the operator's OWN catalog fork, and a default would silently sync
          #     an app-of-apps from someone else's main branch. scripts/e2e.sh:506
          #     injects it as TF_VAR_gitops_repo_url.
          EXEMPT="gitops_repo_url"

          # A leaf is only judged once its validation is known to have RUN. There are
          # exactly two outcomes that mean the check executed:
          #   "All required inputs are passed in by terragrunt"  -> clean
          #   "required inputs are missing"                      -> incomplete
          # Anything else — a parse error, a provider failure, a timeout, terragrunt
          # absent — means the leaf was NOT inspected, and must fail rather than be
          # counted clean. Without this, `|| true` swallows the error, the awk finds
          # no missing-input line, and an unparseable leaf reports as passing. That
          # is the exact vacuous-pass shape this step exists to prevent, and the
          # first version of this step had it.
          PASS_MARK="All required inputs are passed in by terragrunt"
          MISS_MARK="required inputs are missing"

          fail=0
          discovered=0
          validated=0
          while IFS= read -r leaf; do
            dir=$(dirname "$leaf")
            discovered=$((discovered + 1))
            out=$( cd "$dir" && TG_NON_INTERACTIVE=true terragrunt hcl validate --inputs 2>&1 ) || true
            clean=$(echo "$out" | sed 's/\x1b\[[0-9;]*m//g' | grep -cF "$PASS_MARK") || true
            incomplete=$(echo "$out" | sed 's/\x1b\[[0-9;]*m//g' | grep -cF "$MISS_MARK") || true

            if [ "$clean" -eq 0 ] && [ "$incomplete" -eq 0 ]; then
              echo "::error::$dir — terragrunt hcl validate produced neither a pass nor a missing-input result. The leaf was NOT inspected; this is a failure, not a pass."
              echo "$out" | sed 's/\x1b\[[0-9;]*m//g' | tail -6 | sed 's/^/    /'
              fail=1
              continue
            fi

            validated=$((validated + 1))
            [ "$incomplete" -eq 0 ] && continue

            # terragrunt prefixes every line with a timestamp and level, so the
            # missing names arrive as "HH:MM:SS.mmm ERROR \t- name". Match the
            # trailing "- <name>" rather than anchoring at the start of the line.
            missing=$(echo "$out" | sed 's/\x1b\[[0-9;]*m//g' \
                      | awk '/required inputs are missing/{f=1;next} f && /-[[:space:]]+[A-Za-z0-9_]+[[:space:]]*$/{print $NF}')
            if [ -z "$missing" ]; then
              echo "::error::$dir reported missing inputs but none could be parsed out — the extraction is broken, refusing to treat this as clean."
              fail=1
              continue
            fi
            for m in $missing; do
              case " $EXEMPT " in
                *" $m "*) ;;
                *) echo "::error::$dir is missing required input '$m' — the component cannot plan in any environment"; fail=1 ;;
              esac
            done
          done < <(git ls-files 'live/**/terragrunt.hcl' | grep '/terragrunt\.hcl$')

          # Anti-vacuity, measuring EXECUTION rather than discovery. `discovered`
          # counts the file list; `validated` counts leaves whose check demonstrably
          # ran. A gate that inspected nothing must never report success.
          echo "discovered=$discovered validated=$validated"
          if [ "$discovered" -lt 50 ]; then
            echo "::error::only $discovered leaves discovered (expected >= 50) — the file list is wrong, refusing to report a pass"
            exit 1
          fi
          if [ "$validated" -ne "$discovered" ]; then
            echo "::error::$((discovered - validated)) leaf/leaves were never actually validated — refusing to report a pass over them"
            exit 1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "A required input is supplied by nothing. Wire it, or remove the declaration."
            exit 1
          fi
          echo "All $validated live leaves validated, every required input supplied."

  # Guards the dependency mocks: every mock_outputs key must be a real output of the
  # component the dependency points at, so a renamed component output fails here
  # instead of silently resolving to a stale mock value at plan/apply time.
  mock-outputs:
    name: Mock Outputs Cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-mock-outputs.py

  # Guards installability: no leaf under live/aws/workload-*/ may depend on a unit
  # outside its own account directory. A terragrunt `dependency` is resolved while the
  # config is PARSED, so an unapplied cross-account dependency fails `init` — not just
  # `apply` — and no TF_VAR can bypass it. Neither of the other terragrunt gates can
  # see that: evaluate renders against mocks by design, and plan green-skips whenever
  # AWS_ROLE_ARN is unset. So this is the only thing standing between a well-reviewed
  # change and an un-installable default environment. Cross-account worked examples
  # live outside workload-*, in live/aws/reference-adopt/.
  account-local-deps:
    name: Workload Deps Are Account-Local
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-account-local-deps.py

  # Every account id in this tree is a placeholder, and that is correct for a
  # public repo — root.hcl resolves a leaf's OWN account from
  # TERRAGRUNT_ACCOUNT_ID, so it never reaches AWS.
  #
  # A FOREIGN id has no such path. There is one TERRAGRUNT_ACCOUNT_ID and it
  # cannot express "and the backup account is X", so a foreign placeholder is not
  # a stand-in that gets replaced at deploy time — it is a literal that reaches
  # AWS. Two shipped that way: every workload backup plan copied to a vault in an
  # account not in the organization, and every break-glass leaf trusted an
  # unprovisioned account on an AdministratorAccess role.
  foreign-placeholders:
    name: Appliable Leaves Name No Foreign Placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-foreign-placeholders.py

  # The adjacent shape: not a placeholder that reaches AWS, but a reference that
  # never becomes one. Doubling the dollar escapes the interpolation, so the
  # expression ships as its own text — valid HCL, clean fmt, clean validate,
  # clean plan, and a cost filter matching a tag value no resource carries. The
  # budget applies, shows green, and tracks zero forever. Both escapes are
  # legitimate when something downstream resolves them, so each occurrence is
  # either removed or listed with the reason it has to reach the provider
  # unresolved — the contract .checkov.yaml states for its own skips.
  escaped-interpolations:
    name: Every Escaped Interpolation Is Explained
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/check-escaped-interpolations.py

  # A tenant declares its stateful substrate once, in its Platform CR, and two
  # consumers read that declaration — the operator for IAM, this repo for the
  # resources. tenants.generated.json is the rendered second half, committed so a
  # plan is reproducible without reaching four other repos at plan time. Which
  # means it can go stale: a CR that adds a datastore and a substrate that never
  # heard about it disagree silently, and the tenant gets an IAM grant on an ARN
  # that names nothing. Re-rendering here and failing on any difference is what
  # makes the committed file trustworthy rather than a snapshot of some past
  # moment.
  #
  # The tenant repos are checked out for their platform.yaml alone.
  tenant-substrate-render:
    name: Rendered Substrate Matches The Platform CRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/competitive-intelligence
          path: tenant-crs/competitive-intelligence
          sparse-checkout: platform.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/digest-pipeline
          path: tenant-crs/digest-pipeline
          sparse-checkout: platform.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/incident-response
          path: tenant-crs/incident-response
          sparse-checkout: platform.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/slack-knowledge-bot
          path: tenant-crs/slack-knowledge-bot
          sparse-checkout: platform.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: pip install --quiet pyyaml==6.0.3
      - name: re-render every environment that selects tenants
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r sel; do
            env_name=$(basename "$(dirname "$(dirname "$sel")")")
            found=1
            echo "::group::render check — $env_name"
            ./scripts/render-tenants.py \
              --environment "$env_name" \
              --source-root tenant-crs \
              --check
            echo "::endgroup::"
          done < <(git ls-files 'live/aws/*/*/*/tenant-substrate/tenants.selection.yaml' | sort)
          if [ "$found" -eq 0 ]; then
            echo "::error::no tenants.selection.yaml found — this gate checked nothing."
            echo "::error::An environment that provisions tenant substrate must name its tenants there."
            exit 1
          fi

  # The architecture doc's component inventory must be the components that
  # exist, both directions. A documented component that is gone sends a reader
  # to a missing directory; a component no table names is quieter and worse,
  # because the doc reads as complete.
  architecture-components:
    name: Architecture Doc Matches The Tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-architecture-components.sh

  # Guards the component smoke tests: every output key a smoke test reads out of
  # outputs.json must be a real output of the component it belongs to. `jq` returns the
  # string "null" for a key that does not exist rather than failing, so without this a
  # smoke test asserts against nothing and reports it as a result.
  smoke-outputs:
    name: Smoke Test Outputs Cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-smoke-outputs.py

  # A datastore's ingress must admit the NODE security group, never the cluster SG.
  # cluster_security_group_id sits on the EKS control plane's ENIs, so no packet a pod
  # sends carries it: a rule naming it is valid HCL, applies cleanly, and admits
  # nobody. Nothing fails — the workload hangs on connect and the timeout blames the
  # application. No linter models "this rule can never match", and a `tofu test`
  # against a mocked provider asserts the rule exists, not that it can match.
  datastore-ingress-source:
    name: Datastores Admit The Node SG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-datastore-ingress-source.py

  # No component may hard-code a MINOR version of a managed engine. AWS retires
  # minor versions and regional availability differs, so `engine_version = "16.6"`
  # is a bet on what AWS still offers in every region an adopter deploys into — and
  # it loses that bet at APPLY time, after the VPC and the cluster underneath it
  # already exist and bill. Neither tflint nor checkov reads a version literal for
  # retirement risk, and a `tofu test` asserting against a mocked provider never
  # contacts the API that would reject it.
  engine-version-pins:
    name: No Minor-Version Engine Pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-engine-version-pins.py

  # The region a reader believes this repo targets comes from prose and examples —
  # a `task plan REGION=...` in a README, a path in a skill, an ARN in a runbook —
  # not from the tree. Retargeting the live tree is a mechanical rename CI notices
  # at once; retargeting the prose is a hand edit across dozens of files that
  # nothing checked, so the prose is what survived a region move and every copied
  # command landed on a directory that did not exist. The gate reads the deployed
  # regions out of live/aws/ rather than naming one, so it keeps holding through
  # the next move.
  region-consistency:
    name: Prose Names Only Deployed Regions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-region-consistency.py

  # The test job DISCOVERS suites, which is right for running them and wrong for
  # guaranteeing them: a root with no tests/ contributes nothing to the glob, so
  # it is never mentioned and the job goes green having tested everything that
  # asked to be tested. Four roots sat that way, three minting IAM. Discovery
  # cannot see an absence, so the absence is asserted here.
  roots-tested:
    name: Every Root Has A Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-roots-tested.py

  # `|| true` handles a failure and does nothing about a hang. kubectl and curl
  # are unbounded by default, and in the e2e teardown the caller is holding an EKS
  # cluster and NAT gateways that keep billing while it waits. The claim that
  # every call was bounded was written into a comment before it was true, which is
  # what made the gap invisible — so it is a gate now rather than a sentence.
  network-deadlines:
    name: Network Calls Are Bounded
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-network-deadlines.py

  # Prose that names a thing is a claim about the world, and it rots in one
  # direction: renaming a file updates every import and no sentence. So the prose
  # is always the half that goes stale, silently, in the documents a newcomer
  # reads first. This repo learned it once already — CLAUDE.md named a gate as
  # .sh when the file is .py, in the document every session here loads.
  named-paths:
    name: Paths Named In Prose Resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-named-paths-resolve.py

  # The central backup plan selects on the BackupPolicy tag, so a data store no
  # tag can reach cannot be backed up at all — and nothing reports that. No apply
  # fails, no drift appears; the gap surfaces at the restore that does not happen.
  # This gates the reachability, not the choice: whether a store IS enrolled is an
  # operator's decision, whether it CAN be is the component's responsibility.
  backup-coverage:
    name: Every Data Store Can Be Backed Up
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-backup-coverage.py

  # A job with no timeout-minutes inherits GitHub's 360-minute default, which is a
  # six-hour bill for a job that stopped making progress. On drift.yml's weekday
  # schedule a hung run is still holding a runner when the next one starts, so the
  # failure presents as a queue rather than as the hang it is. The value is the
  # author's judgement; that a bound exists is not.
  workflow-budgets:
    name: Every Workflow Job Is Bounded
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - run: python3 scripts/check-workflow-budgets.py

  # A pin nobody watches keeps working and keeps passing CI until the upstream it
  # names is retired or a CVE lands on it, at which point it is found by the
  # outage. Renovate's built-in managers read .tf files and the `uses:` line of a
  # step; they do not read the version an action is TOLD to install, which is the
  # toolchain every job here runs on, nor a bare `pip install x==y`. This asserts
  # both halves: every pin is matched by a manager, and every file classified as
  # carrying no version actually carries none.
  version-coverage:
    name: Every Version Pin Is Watched
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-version-coverage.py

  # This repository ships no package manifest, so its dependency surface IS these
  # workflows: the actions they call and the tokens those actions hold. zizmor is
  # the gate over that surface — template injection into a `run:` block, tokens
  # persisted into the git config after checkout, permissions granted at the
  # workflow level that only one job needs, and actions referenced by a mutable
  # tag the upstream owner can repoint.
  #
  # --offline is load-bearing rather than a speed choice: it makes the verdict a
  # function of the commit under test instead of of what the network answered, so
  # the same commit cannot pass today and fail tomorrow for reasons outside it.
  # The version is pinned for the same reason.
  workflows:
    name: Workflow Security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install zizmor==1.16.3
      - run: zizmor --offline --persona=regular .github/workflows/

  # The gates above are the assertions no `tofu test` can reach, and they are regex
  # over HCL — a matcher that stops matching keeps exiting 0, and the summary line
  # reports files scanned rather than violations found, so a blind gate is
  # indistinguishable from a clean tree. Each gate's own anti-vacuity floor catches
  # a scan that sees nothing; this catches the narrower break where the scan sees
  # the tree and the matcher no longer recognises it. One positive control per
  # gate: copy the tree, introduce the violation, require a non-zero exit.
  gate-controls:
    name: Gates Detect Their Own Violations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-gates-detect.py

  # A Deny whose Condition can never be satisfied is not a guardrail. IAM ANDs every
  # key inside one Condition block, so a Deny with several required-absent Null keys
  # fires only when ALL of them are missing — a resource carrying one and missing
  # another sails through, while the policy description says the opposite. The
  # EnforceMandatoryTags SCP shipped exactly that shape, and because live/root.hcl
  # injects DataClassification via default_tags the AND was never satisfiable at all:
  # it read as enforcement and denied nothing. No linter models policy satisfiability.
  scp-deny-can-fire:
    name: SCP Denies Can Actually Fire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-scp-deny-can-fire.py

  # Documentation must not describe a GitHub OIDC trust wider than the component
  # ships. The threat model cites trust scoping as the mitigation for a foreign
  # workflow assuming the deploy role, and the troubleshooting guide shows a policy
  # an operator is told to match — so a documented wildcard claim states the
  # vulnerability as the control in one place and teaches an operator to create it
  # in the other. Permitted suffixes are read from the component's own variables.tf,
  # so widening the component widens what may be documented and the two cannot drift
  # apart in the direction that matters.
  documented-oidc-trust:
    name: Docs Match The OIDC Trust Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-documented-oidc-trust.py

  # Every teardown gate on a component must open on the same lever. AWS spreads the
  # protections across unrelated resources and nothing in the dependency graph joins
  # them, so a partially-gated component empties its buckets, fails on the database it
  # still protects, and halts the reverse sweep with the cluster, VPC and NAT still
  # billing. No tflint or checkov rule covers force_destroy or deletion_protection, and
  # a `tofu test` cannot reach a grandchild module's attributes — this is the only gate
  # that reads the resource bodies.
  teardown-gates:
    name: Teardown Gates Move Together
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-teardown-gates.py

  # A field a tenant can declare that no resource reads is a control an operator can set,
  # sees accepted, and believes is in force — `object_lock_enabled = true` on a production
  # audit archive reads as WORM from the schema, the leaf and the docs, and delivers
  # nothing. Same shape as a dead allow-rule: valid, accepted by every other gate, inert.
  tenant-schema-readers:
    name: Tenant Fields Reach A Resource
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-tenant-schema-readers.py

  # The e2e run's zero-billable assertion at teardown is the reason that script is
  # trusted, and it can only see what the run created. tenant-substrate — every
  # Aurora cluster, cache, table, bucket and queue a tenant declares — was in
  # neither its apply list nor its destroy loop, so the check reported clean over
  # a whole resource class it had never looked at. Every other guard script
  # inspects component internals; none reads e2e.sh, and none compares its
  # component list against the leaves that exist.
  e2e-covers-leaves:
    name: E2E Covers Every Live Leaf
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-e2e-covers-leaves.py

  plan:
    name: Plan (${{ matrix.cloud }}/${{ matrix.env }}/${{ matrix.component }})
    needs: [discover, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The credential this job assumes is the READ-ONLY plan role, and the
    # environment is what makes that safe. The job runs on pull_request; declaring
    # `environment: plan` makes its OIDC token present
    # repo:<org>/<repo>:environment:plan instead of a pull_request or branch claim,
    # which is the only sub the plan role trusts. The deploy role — which can
    # provision and destroy EKS and IAM — trusts none of these contexts and is not
    # reachable from here. Adding required reviewers to the `plan` environment in
    # repo settings additionally gates it on a human before any credential is
    # issued; approval is per-environment-per-run, so one approval releases the
    # whole matrix.
    environment: plan
    # The plan jobs need AWS credentials (vars.AWS_ROLE_ARN). continue-on-error is
    # tied to whether that variable is set:
    #   - unset (e.g. a fork without cloud creds): continue-on-error is true and the
    #     Plan step below skips entirely, so the matrix entry comes back green-skipped
    #     rather than forcing a fork to fail on a plan it can't run.
    #   - set: continue-on-error is false, so a real `terragrunt plan` failure blocks
    #     the build — an honest gate, not an advisory that swallows regressions.
    # The always-hard gates are the placeholder check, fmt, validate, tflint, checkov,
    # the tofu test suites, terragrunt evaluate, and the two output cross-checks.
    continue-on-error: ${{ vars.AWS_ROLE_ARN == '' || vars.TERRAGRUNT_ACCOUNT_ID == '' }}
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.plan) }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: "1.11.5"
      - uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3
        with:
          tg_version: "1.0.8"
          # gruntwork-io/terragrunt-action@v3 manages its own tool versions
          # via mise. Without a mise.toml in the repo it requires tofu_version
          # to be passed explicitly — even though the previous opentofu/setup
          # step put tofu on PATH already.
          tofu_version: "1.11.5"

      # Credential guard. The auth step runs only when the AWS_ROLE_ARN repo
      # variable is set. When unset, the auth step skips and the Plan step
      # below skips with it, so the matrix entry comes back green-skipped
      # rather than red-fail. Set AWS_ROLE_ARN in repo settings
      # (Actions → Variables) to enable real plans.
      - name: Configure AWS credentials
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      - name: Detect credential availability
        id: creds
        run: |
          # BOTH are required. A role without an account id resolves the backend
          # through root.hcl's placeholder fallback (111111111111-<region>-tfstate),
          # a bucket in an account that does not exist — so every leaf dies at
          # backend init with NoSuchBucket before any plan runs. Half-arming the
          # matrix is strictly worse than leaving it off: it reds every PR without
          # evaluating a single line of config.
          if [ -n "${VARS_AWS_ROLE_ARN}" ] && [ -n "${VARS_TERRAGRUNT_ACCOUNT_ID}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VARS_AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          VARS_TERRAGRUNT_ACCOUNT_ID: ${{ vars.TERRAGRUNT_ACCOUNT_ID }}

      - name: Skip notice (no cloud credentials configured)
        if: steps.creds.outputs.available != 'true'
        run: |
          echo "::notice::Skipping plan for ${{ matrix.cloud }}/${{ matrix.env }}/${{ matrix.component }} — needs BOTH AWS_ROLE_ARN and TERRAGRUNT_ACCOUNT_ID in repo Variables."

      - name: Plan
        if: steps.creds.outputs.available == 'true'
        working-directory: live/${{ matrix.cloud }}/${{ matrix.account }}/${{ matrix.region }}/${{ matrix.env }}/${{ matrix.component }}
        # root.hcl:13 reads TERRAGRUNT_ACCOUNT_ID and falls back to the tracked
        # account.hcl placeholder when it is unset. That fallback is correct for a
        # public template and fatal for a real plan, so the id is injected here as
        # the env var root.hcl already documents rather than written into a tracked
        # file — the same path scripts/e2e.sh uses.
        env:
          TERRAGRUNT_ACCOUNT_ID: ${{ vars.TERRAGRUNT_ACCOUNT_ID }}
        run: terragrunt plan -no-color

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      [
        placeholders,
        fmt,
        discover,
        validate,
        test,
        tflint,
        checkov,
        evaluate,
        mock-outputs,
        account-local-deps,
        foreign-placeholders,
        escaped-interpolations,
        tenant-substrate-render,
        architecture-components,
        smoke-outputs,
        documented-oidc-trust,
        region-consistency,
        gate-controls,
        workflows,
        version-coverage,
        workflow-budgets,
        backup-coverage,
        named-paths,
        network-deadlines,
        roots-tested,
        scp-deny-can-fire,
        datastore-ingress-source,
        engine-version-pins,
        teardown-gates,
        tenant-schema-readers,
        e2e-covers-leaves,
        plan,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
