# The tenants this environment provisions substrate for.
#
# A Platform CR declares WHAT stores a tenant needs; it carries no environment,
# because the same CR is applied to whichever cluster runs the app. This file is
# the other half — WHICH environments provision those stores. Adding a tenant
# here is the whole act; what it gets is read from its own CR.
#
# Empty, and that is a state rather than a gap: no tenant is promoted to production
# yet. The file exists so this environment is covered by the CI render check —
# the check keys off this file's presence, so an environment without one is not
# verified against the Platform CRs at all, which is the quieter failure.
#
# Rendered by scripts/render-tenants.py into tenants.generated.json, which the
# leaf reads. CI re-renders and fails on drift.
tenants: []
