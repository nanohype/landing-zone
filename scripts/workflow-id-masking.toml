# Digits 0-7 behind a leading 0 are octal to YAML 1.1: the value is
# 1402433619, and only the source text still reads as an account id.
[[mutation]]
name = "a literal account id YAML reads as octal, as an env value"
file = "deploy.yml"
old = '''
          TERRAGRUNT_ACCOUNT_ID: ${{ secrets.DEPLOY_ACCOUNT_ID }}
          COMPONENT: ${{ inputs.component }}
          ACTION'''
new = '''
          TERRAGRUNT_ACCOUNT_ID: 012345670123
          COMPONENT: ${{ inputs.component }}
          ACTION'''
must_say = "carries an account id as a literal"

[[mutation]]
name = "a literal account id YAML reads as octal, as an env key"
file = "deploy.yml"
old = '''
          TERRAGRUNT_ACCOUNT_ID: ${{ secrets.DEPLOY_ACCOUNT_ID }}
          COMPONENT: ${{ inputs.component }}
          ACTION'''
new = '''
          TERRAGRUNT_ACCOUNT_ID: ${{ secrets.DEPLOY_ACCOUNT_ID }}
          COMPONENT: ${{ inputs.component }}
