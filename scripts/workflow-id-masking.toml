          ACTION'''
must_say = "carries an account id as a literal"

# The parser's own message quotes the line it stopped at; the finding is
# at line 1 and must say <account id>, not the digits.
[[mutation]]
name = "a workflow that does not parse, at a line carrying an account id"
file = "deploy.yml"
old = '''
          TERRAGRUNT_ACCOUNT_ID: ${{ secrets.DEPLOY_ACCOUNT_ID }}
          COMPONENT: ${{ inputs.component }}
          ACTION'''
new = '''
          TERRAGRUNT_ACCOUNT_ID: ${{ secrets.DEPLOY_ACCOUNT_ID }}
          COMPONENT: ${{ inputs.component }}
          OWNER: 222233334444: x
          ACTION'''
line = '^name: Deploy$'
must_say = "could not be parsed"

# PyYAML cuts its excerpt to about 75 characters around the column; here
# the cut falls inside the id, leaving a tail too short to redact.
[[mutation]]
name = "a workflow that does not parse, with an account id at the parser's excerpt cut"
file = "deploy.yml"
old = '''
          TERRAGRUNT_ACCOUNT_ID: ${{ secrets.DEPLOY_ACCOUNT_ID }}
          COMPONENT: ${{ inputs.component }}
          ACTION'''
new = '''
          TERRAGRUNT_ACCOUNT_ID: ${{ secrets.DEPLOY_ACCOUNT_ID }}
          COMPONENT: ${{ inputs.component }}
          OWNER: x 222233334444 qqqqqqqqqqqqqqqqqqqqq: y
          ACTION'''
line = '^name: Deploy$'
must_say = "could not be parsed"

