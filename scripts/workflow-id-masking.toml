[[mutation]]
name = "a literal account id YAML reads as a number, as an env value"
file = "deploy.yml"
old = '''
          TERRAGRUNT_ACCOUNT_ID: ${{ secrets.DEPLOY_ACCOUNT_ID }}
          COMPONENT: ${{ inputs.component }}
          ACTION'''
new = '''
          TERRAGRUNT_ACCOUNT_ID: 222233334444
          COMPONENT: ${{ inputs.component }}
          ACTION'''
must_say = "carries an account id as a literal"

[[mutation]]
name = "a literal account id YAML reads as a number, as an action input"
file = "destroy.yml"
old = '''
          aws-region: ${{ inputs.region }}
'''
new = '''
          aws-region: ${{ inputs.region }}
          role-session-name: 222233334444
'''
must_say = "carries an account id as a literal"

[[mutation]]
name = "a literal account id YAML reads as a number, as an env key"
file = "deploy.yml"
old = '''
          TERRAGRUNT_ACCOUNT_ID: ${{ secrets.DEPLOY_ACCOUNT_ID }}
          COMPONENT: ${{ inputs.component }}
