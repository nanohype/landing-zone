# The coverage every Python script under scripts/ meets under the runs CI makes
# of it, in percent: scripts/gate-coverage.py runs every gate and every
# self-test under coverage.py and holds each script to these.

[floor]
line = 75
branch = 60

# A script held above the floor: "scripts/x.py" = { line = 100, branch = 100,
# why = "..." }, with the reason it is held higher.
[override]
"scripts/mask-aws-ids.py" = { line = 100, branch = 100, why = "It decides what every workflow masks before an account id can reach this public repository's Actions logs, so a line or branch its runs leave unreached is a mask rule nothing shows to hold." }
"scripts/check-drift-workflow.py" = { line = 100, branch = 100, why = "It keeps DRIFT_PLAN_ROLE_ARNS, the map of every account's plan role, on drift.yml's own jobs, so a line or branch its runs leave unreached is a way to read that map nothing shows refused." }
